name: Build Linux ARM64 Kylin WebKit 4.0

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name, e.g. v1.9.2-kylin-arm64"
        required: false
        default: "kylin-arm64"
        type: string

permissions:
  contents: read

jobs:
  build-arm64:
    #
    # GitHub 官方 ARM64 runner
    #
    runs-on: ubuntu-24.04-arm

    #
    # 真正编译放进 Ubuntu 20.04 ARM64 容器中
    #
    # 这样最终二进制不会绑定 Ubuntu 24.04 的 glibc 2.39
    #
    container:
      image: ubuntu:20.04

    env:
      DEBIAN_FRONTEND: noninteractive
      CGO_ENABLED: "1"
      GOOS: linux
      GOARCH: arm64

    steps:
      # ------------------------------------------------------------
      # 1. 基础工具
      # ------------------------------------------------------------
      - name: Install base packages
        shell: bash
        run: |
          set -euxo pipefail

          apt-get update

          apt-get install -y \
            ca-certificates \
            curl \
            wget \
            git \
            xz-utils \
            tar \
            gzip \
            unzip \
            file \
            build-essential \
            gcc \
            g++ \
            make \
            pkg-config \
            binutils \
            patchelf \
            desktop-file-utils

          echo "===== Architecture ====="
          uname -a
          dpkg --print-architecture

          echo "===== GLIBC ====="
          ldd --version | head -1

      # ------------------------------------------------------------
      # 2. GTK3 + WebKitGTK 4.0
      #
      # Ubuntu 20.04：
      #   libgtk-3-dev
      #   libwebkit2gtk-4.0-dev
      #   libsoup2.4-dev
      # ------------------------------------------------------------
      - name: Install GTK3 WebKitGTK 4.0
        shell: bash
        run: |
          set -euxo pipefail

          apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libsoup2.4-dev \
            libglib2.0-dev

          echo
          echo "===== GTK ====="
          pkg-config --modversion gtk+-3.0

          echo
          echo "===== WebKitGTK ====="
          pkg-config --modversion webkit2gtk-4.0

          echo
          echo "===== libsoup ====="
          pkg-config --modversion libsoup-2.4

          echo
          echo "===== pkg-config checks ====="

          pkg-config --exists gtk+-3.0
          pkg-config --exists webkit2gtk-4.0
          pkg-config --exists libsoup-2.4

      # ------------------------------------------------------------
      # 3. Checkout
      # ------------------------------------------------------------
      - name: Checkout uniTerm
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # 4. Go
      #
      # uniterm v1.9.2 go.mod 要求 Go 1.26.x
      # ------------------------------------------------------------
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"
          cache: true

      # ------------------------------------------------------------
      # 5. Node.js
      # ------------------------------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # ------------------------------------------------------------
      # 6. 显示版本
      # ------------------------------------------------------------
      - name: Show environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== Go ====="
          go version

          echo "===== Node ====="
          node --version

          echo "===== npm ====="
          npm --version

          echo "===== GCC ====="
          gcc --version | head -1

          echo "===== GLIBC ====="
          ldd --version | head -1

          echo "===== ARCH ====="
          uname -m

          echo "===== WebKitGTK ====="
          pkg-config --modversion webkit2gtk-4.0

      # ------------------------------------------------------------
      # 7. 下载 Go modules
      # ------------------------------------------------------------
      - name: Download Go modules
        shell: bash
        run: |
          set -euxo pipefail

          go mod download

      # ------------------------------------------------------------
      # 8. Patch Wails v3
      #
      # 当前 Wails v3 GTK3：
      #
      #   webkit2gtk-4.1
      #   libsoup-3.0
      #
      # 改为：
      #
      #   webkit2gtk-4.0
      #   libsoup-2.4
      #
      # 注意：
      # uniterm v1.9.2 实际依赖 beta.16
      # ------------------------------------------------------------
      - name: Patch Wails v3 for WebKitGTK 4.0
        shell: bash
        run: |
          set -euxo pipefail

          WAILS_DIR="$(go list -m -f '{{.Dir}}' github.com/wailsapp/wails/v3)"

          echo "Wails directory:"
          echo "$WAILS_DIR"

          test -n "$WAILS_DIR"
          test -d "$WAILS_DIR"

          #
          # Go module cache 默认只读
          #
          chmod -R u+w "$WAILS_DIR"

          echo
          echo "===== Before patch ====="

          grep -R \
            --include='*.go' \
            -n \
            -E 'webkit2gtk-4\.1|libsoup-3\.0' \
            "$WAILS_DIR/v3" || true

          #
          # GTK3 相关 Go/CGo 文件：
          #
          # WebKit 4.1 -> WebKit 4.0
          # libsoup 3   -> libsoup 2
          #
          find "$WAILS_DIR/v3" \
            -type f \
            -name '*.go' \
            -print0 \
            | xargs -0 sed -i \
                -e 's/webkit2gtk-4\.1/webkit2gtk-4.0/g' \
                -e 's/libsoup-3\.0/libsoup-2.4/g'

          echo
          echo "===== After patch ====="

          if grep -R \
            --include='*.go' \
            -n \
            -E 'webkit2gtk-4\.1|libsoup-3\.0' \
            "$WAILS_DIR/v3"; then

            echo
            echo "ERROR: Some WebKitGTK 4.1 references remain."
            exit 1
          fi

          echo
          echo "Wails GTK3 patch completed."

      # ------------------------------------------------------------
      # 9. 安装 Wails CLI
      #
      # CLI 本身也要 gtk3
      # ------------------------------------------------------------
      - name: Install Wails3 CLI
        shell: bash
        run: |
          set -euxo pipefail

          WAILS_DIR="$(go list -m -f '{{.Dir}}' github.com/wailsapp/wails/v3)"

          #
          # 不能重新 go install github.com/...@version
          #
          # 因为那样会重新下载未 patch 的 Wails。
          #
          # 必须直接从已经 patch 的 module directory 编译。
          #
          cd "$WAILS_DIR/v3/cmd/wails3"

          go install -tags gtk3 .

          export PATH="$(go env GOPATH)/bin:$PATH"

          wails3 version || true

      # ------------------------------------------------------------
      # 10. Frontend dependencies
      # ------------------------------------------------------------
      - name: Install frontend dependencies
        shell: bash
        run: |
          set -euxo pipefail

          cd frontend

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # ------------------------------------------------------------
      # 11. 生成 Wails build assets
      # ------------------------------------------------------------
      - name: Generate build assets
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$(go env GOPATH)/bin:$PATH"

          wails3 task common:update:build-assets

      # ------------------------------------------------------------
      # 12. 编译
      #
      # gtk3 tag 必须有
      # ------------------------------------------------------------
      - name: Build uniTerm ARM64
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$(go env GOPATH)/bin:$PATH"

          VERSION="${{ inputs.version }}"

          echo
          echo "=========================================="
          echo " Building uniTerm"
          echo " ARCH     : arm64"
          echo " GTK      : 3"
          echo " WebKit   : 4.0"
          echo " libsoup  : 2.4"
          echo " VERSION  : $VERSION"
          echo "=========================================="
          echo

          pkg-config --modversion gtk+-3.0
          pkg-config --modversion webkit2gtk-4.0
          pkg-config --modversion libsoup-2.4

          wails3 build \
            GOOS=linux \
            ARCH=arm64 \
            VERSION="$VERSION" \
            EXTRA_TAGS=gtk3

          chmod +x bin/uniTerm

          file bin/uniTerm

      # ------------------------------------------------------------
      # 13. 检查 ELF
      # ------------------------------------------------------------
      - name: Verify ARM64 binary
        shell: bash
        run: |
          set -euxo pipefail

          file bin/uniTerm

          echo
          echo "===== Dynamic dependencies ====="

          ldd bin/uniTerm || true

          echo
          echo "===== WebKit references ====="

          readelf -d bin/uniTerm | grep -Ei \
            'webkit|javascriptcore|soup|gtk' || true

          echo
          echo "===== GLIBC requirements ====="

          objdump -T bin/uniTerm 2>/dev/null \
            | grep -o 'GLIBC_[0-9.]*' \
            | sort -Vu \
            | tail -20 || true

          MAX_GLIBC="$(
            objdump -T bin/uniTerm 2>/dev/null \
              | grep -o 'GLIBC_[0-9.]*' \
              | sort -Vu \
              | tail -1
          )"

          echo
          echo "Maximum required GLIBC:"
          echo "$MAX_GLIBC"

          #
          # Ubuntu 20.04 = glibc 2.31
          #
          if echo "$MAX_GLIBC" | grep -Eq \
            'GLIBC_(2\.(3[2-9]|[4-9][0-9])|[3-9]\.)'; then

            echo "ERROR: binary requires glibc newer than 2.31"
            exit 1
          fi

      # ------------------------------------------------------------
      # 14. 确认没有 WebKit 4.1 / Soup3
      # ------------------------------------------------------------
      - name: Verify WebKitGTK 4.0 linkage
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== Required shared objects ====="

          readelf -d bin/uniTerm \
            | grep NEEDED || true

          if readelf -d bin/uniTerm | grep -q 'webkit2gtk-4.1'; then
            echo "ERROR: binary still requires WebKitGTK 4.1"
            exit 1
          fi

          if readelf -d bin/uniTerm | grep -q 'libsoup-3.0'; then
            echo "ERROR: binary still requires libsoup 3"
            exit 1
          fi

          echo
          echo "WebKitGTK 4.1 dependency: NOT FOUND"
          echo "libsoup 3 dependency       : NOT FOUND"
          echo "OK."

      # ------------------------------------------------------------
      # 15. tar.gz
      # ------------------------------------------------------------
      - name: Create tar.gz package
        shell: bash
        run: |
          set -euxo pipefail

          VERSION="${{ inputs.version }}"

          mkdir -p dist/uniterm

          cp bin/uniTerm dist/uniterm/uniterm

          cat > dist/uniterm/README-KYLIN.txt <<'EOF'
          uniTerm ARM64 - Kylin V10 / Ubuntu 20.04 compatible build

          Architecture:
            ARM64 / aarch64

          Runtime:
            GTK3
            WebKit2GTK 4.0
            libsoup 2.4

          Required packages:

            sudo apt install \
              libgtk-3-0 \
              libwebkit2gtk-4.0-37 \
              libsoup2.4-1

          Run:

            chmod +x uniterm
            ./uniterm

          Check architecture:

            uname -m

          Expected:

            aarch64
          EOF

          cd dist

          tar -czf \
            "../uniterm-linux-arm64-webkit40-${VERSION}.tar.gz" \
            uniterm

          cd ..

          ls -lh \
            "uniterm-linux-arm64-webkit40-${VERSION}.tar.gz"

      # ------------------------------------------------------------
      # 16. 创建 DEB
      # ------------------------------------------------------------
      - name: Create DEB package
        shell: bash
        run: |
          set -euxo pipefail

          VERSION="${{ inputs.version }}"

          #
          # Debian version 不能随便带某些字符
          #
          DEB_VERSION="$(
            echo "$VERSION" \
              | sed 's/^v//' \
              | sed 's/[^0-9A-Za-z.+:~\-]/-/g'
          )"

          PKGROOT="dist/deb"

          mkdir -p \
            "$PKGROOT/DEBIAN" \
            "$PKGROOT/usr/bin" \
            "$PKGROOT/usr/share/applications" \
            "$PKGROOT/usr/share/icons/hicolor/256x256/apps"

          install -m 755 \
            bin/uniTerm \
            "$PKGROOT/usr/bin/uniterm"

          #
          # desktop entry
          #
          if [ -f build/linux/uniTerm.desktop ]; then

            cp build/linux/uniTerm.desktop \
              "$PKGROOT/usr/share/applications/uniterm.desktop"

          elif [ -f build/linux/uniterm.desktop ]; then

            cp build/linux/uniterm.desktop \
              "$PKGROOT/usr/share/applications/uniterm.desktop"

          else

            cat > "$PKGROOT/usr/share/applications/uniterm.desktop" <<'EOF'
          [Desktop Entry]
          Name=uniTerm
          Comment=All-in-one terminal
          Exec=/usr/bin/uniterm
          Terminal=false
          Type=Application
          Categories=Development;System;TerminalEmulator;
          EOF

          fi

          #
          # Icon
          #
          if [ -f build/appicon.png ]; then
            cp build/appicon.png \
              "$PKGROOT/usr/share/icons/hicolor/256x256/apps/uniterm.png"
          fi

          cat > "$PKGROOT/DEBIAN/control" <<EOF
          Package: uniterm
          Version: ${DEB_VERSION}
          Section: utils
          Priority: optional
          Architecture: arm64
          Maintainer: uniTerm ARM64 Kylin Build
          Depends: libgtk-3-0, libwebkit2gtk-4.0-37, libsoup2.4-1
          Homepage: https://github.com/ys-ll/uniterm
          Description: uniTerm ARM64 build for Kylin V10
           GTK3 + WebKit2GTK 4.0 compatible build for
           Kylin V10 and Ubuntu 20.04 based ARM64 systems.
          EOF

          dpkg-deb \
            --build \
            --root-owner-group \
            "$PKGROOT" \
            "uniterm-linux-arm64-webkit40-${VERSION}.deb"

          ls -lh \
            "uniterm-linux-arm64-webkit40-${VERSION}.deb"

      # ------------------------------------------------------------
      # 17. 最终检查
      # ------------------------------------------------------------
      - name: Final artifact information
        shell: bash
        run: |
          set -euxo pipefail

          echo
          echo "=========================================="
          echo " Build completed"
          echo "=========================================="

          ls -lh \
            uniterm-linux-arm64-webkit40-*

          echo
          echo "Binary:"
          file bin/uniTerm

          echo
          echo "SHA256:"

          sha256sum \
            uniterm-linux-arm64-webkit40-*

      # ------------------------------------------------------------
      # 18. 上传 GitHub Actions Artifact
      # ------------------------------------------------------------
      - name: Upload ARM64 Kylin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uniterm-linux-arm64-webkit40
          if-no-files-found: error
          retention-days: 30
          path: |
            uniterm-linux-arm64-webkit40-*.tar.gz
            uniterm-linux-arm64-webkit40-*.deb
