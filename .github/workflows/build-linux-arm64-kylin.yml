      - name: Patch Wails v3 for WebKitGTK 4.0
        shell: bash
        run: |
          set -euxo pipefail

          WAILS_DIR="$(go list -m -f '{{.Dir}}' github.com/wailsapp/wails/v3)"

          echo "===== Wails module directory ====="
          echo "$WAILS_DIR"

          test -n "$WAILS_DIR"
          test -d "$WAILS_DIR"

          echo "===== Wails directory contents ====="
          ls -la "$WAILS_DIR"

          chmod -R u+w "$WAILS_DIR"

          echo "===== Before patch ====="

          grep -R \
            --include='*.go' \
            -n \
            -E 'webkit2gtk-4\.1|libsoup-3\.0' \
            "$WAILS_DIR" || true

          echo "===== Applying patch ====="

          find "$WAILS_DIR" \
            -type f \
            -name '*.go' \
            -print0 \
            | xargs -0 sed -i \
                -e 's/webkit2gtk-4\.1/webkit2gtk-4.0/g' \
                -e 's/libsoup-3\.0/libsoup-2.4/g'

          echo "===== After patch ====="

          REMAINING="$(
            grep -R \
              --include='*.go' \
              -n \
              -E 'webkit2gtk-4\.1|libsoup-3\.0' \
              "$WAILS_DIR" || true
          )"

          if [ -n "$REMAINING" ]; then
            echo "$REMAINING"
            echo "ERROR: WebKitGTK 4.1 / libsoup 3 references still remain."
            exit 1
          fi

          echo "===== Verify WebKitGTK 4.0 references ====="

          grep -R \
            --include='*.go' \
            -n \
            'webkit2gtk-4.0' \
            "$WAILS_DIR" \
            | sed -n '1,30p' || true

          echo "===== Verify libsoup 2.4 references ====="

          grep -R \
            --include='*.go' \
            -n \
            'libsoup-2.4' \
            "$WAILS_DIR" \
            | sed -n '1,30p' || true

          echo "Wails WebKitGTK 4.0 patch completed successfully."

      - name: Install Wails3 CLI
        shell: bash
        run: |
          set -euxo pipefail

          WAILS_DIR="$(go list -m -f '{{.Dir}}' github.com/wailsapp/wails/v3)"

          echo "Wails directory:"
          echo "$WAILS_DIR"

          test -d "$WAILS_DIR/cmd/wails3"

          cd "$WAILS_DIR/cmd/wails3"

          echo "===== Building patched wails3 ====="

          go install -tags gtk3 .

          export PATH="$(go env GOPATH)/bin:$PATH"

          echo "===== Wails3 binary ====="
          which wails3

          echo "===== Wails3 version ====="
          wails3 version || true
