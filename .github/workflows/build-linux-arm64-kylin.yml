name: Build Linux ARM64 Kylin WebKit 4.0

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name, e.g. v1.9.2-kylin-arm64"
        required: false
        default: "v1.9.2-kylin-arm64"
        type: string

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm

    container:
      image: ubuntu:20.04

    env:
      DEBIAN_FRONTEND: noninteractive
      CGO_ENABLED: "1"
      GOOS: linux
      GOARCH: arm64

    steps:
      - name: Install base packages
        shell: bash
        run: |
          set -euxo pipefail

          apt-get update

          apt-get install -y \
            ca-certificates \
            curl \
            wget \
            git \
            xz-utils \
            tar \
            gzip \
            unzip \
            file \
            build-essential \
            gcc \
            g++ \
            make \
            pkg-config \
            binutils \
            patchelf \
            desktop-file-utils

          echo "===== Architecture ====="
          uname -a
          dpkg --print-architecture

          echo "===== GLIBC ====="
          ldd --version | sed -n '1p'

      - name: Install GTK3 WebKitGTK 4.0
        shell: bash
        run: |
          set -euxo pipefail

          apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libsoup2.4-dev \
            libglib2.0-dev

          echo "===== GTK ====="
          pkg-config --modversion gtk+-3.0

          echo "===== WebKitGTK ====="
          pkg-config --modversion webkit2gtk-4.0

          echo "===== libsoup ====="
          pkg-config --modversion libsoup-2.4

          pkg-config --exists gtk+-3.0
          pkg-config --exists webkit2gtk-4.0
          pkg-config --exists libsoup-2.4

      - name: Checkout uniTerm
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Show environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== Go ====="
          go version

          echo "===== Node ====="
          node --version

          echo "===== npm ====="
          npm --version

          echo "===== GCC ====="
          gcc --version | sed -n '1p'

          echo "===== GLIBC ====="
          ldd --version | sed -n '1p'

          echo "===== ARCH ====="
          uname -m

          echo "===== GTK ====="
          pkg-config --modversion gtk+-3.0

          echo "===== WebKitGTK ====="
          pkg-config --modversion webkit2gtk-4.0

          echo "===== libsoup ====="
          pkg-config --modversion libsoup-2.4

      - name: Download Go modules
        shell: bash
        run: |
          set -euxo pipefail

          go mod download

      - name: Patch Wails v3 for WebKitGTK 4.0
        shell: bash
        run: |
          set -euxo pipefail

          WAILS_DIR="$(go list -m -f '{{.Dir}}' github.com/wailsapp/wails/v3)"

          echo "===== Wails module directory ====="
          echo "$WAILS_DIR"

          test -n "$WAILS_DIR"
          test -d "$WAILS_DIR"

          echo "===== Wails directory contents ====="
          ls -la "$WAILS_DIR"

          chmod -R u+w "$WAILS_DIR"

          echo "===== Before patch ====="

          grep -R \
            --include='*.go' \
            -n \
            -E 'webkit2gtk-4\.1|libsoup-3\.0' \
            "$WAILS_DIR" || true

          echo "===== Applying patch ====="

          find "$WAILS_DIR" \
            -type f \
            -name '*.go' \
            -print0 \
            | xargs -0 sed -i \
                -e 's/webkit2gtk-4\.1/webkit2gtk-4.0/g' \
                -e 's/libsoup-3\.0/libsoup-2.4/g'

          echo "===== After patch ====="

          REMAINING="$(
            grep -R \
              --include='*.go' \
              -n \
              -E 'webkit2gtk-4\.1|libsoup-3\.0' \
              "$WAILS_DIR" || true
          )"

          if [ -n "$REMAINING" ]; then
            echo "$REMAINING"
            echo "ERROR: WebKitGTK 4.1 or libsoup 3 references still remain."
            exit 1
          fi

          echo "===== WebKitGTK 4.0 references ====="

          grep -R \
            --include='*.go' \
            -n \
            'webkit2gtk-4.0' \
            "$WAILS_DIR" \
            | sed -n '1,40p' || true

          echo "===== libsoup 2.4 references ====="

          grep -R \
            --include='*.go' \
            -n \
            'libsoup-2.4' \
            "$WAILS_DIR" \
            | sed -n '1,40p' || true

          echo "Wails WebKitGTK 4.0 patch completed successfully."

      - name: Install patched Wails3 CLI
        shell: bash
        run: |
          set -euxo pipefail

          WAILS_DIR="$(go list -m -f '{{.Dir}}' github.com/wailsapp/wails/v3)"

          echo "===== Wails directory ====="
          echo "$WAILS_DIR"

          test -d "$WAILS_DIR/cmd/wails3"

          cd "$WAILS_DIR/cmd/wails3"

          echo "===== Building patched wails3 ====="

          go install -tags gtk3 .

          export PATH="$(go env GOPATH)/bin:$PATH"

          echo "===== Wails3 binary ====="
          which wails3

          echo "===== Wails3 version ====="
          wails3 version || true

      - name: Install frontend dependencies
        shell: bash
        run: |
          set -euxo pipefail

          cd frontend

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Generate build assets
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$(go env GOPATH)/bin:$PATH"

          wails3 task common:update:build-assets

      - name: Build uniTerm ARM64
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$(go env GOPATH)/bin:$PATH"

          VERSION="${{ inputs.version }}"

          echo "=========================================="
          echo " Building uniTerm"
          echo " ARCH     : arm64"
          echo " GTK      : 3"
          echo " WebKit   : 4.0"
          echo " libsoup  : 2.4"
          echo " VERSION  : $VERSION"
          echo "=========================================="

          echo "===== Dependency versions ====="
          pkg-config --modversion gtk+-3.0
          pkg-config --modversion webkit2gtk-4.0
          pkg-config --modversion libsoup-2.4

          wails3 build \
            GOOS=linux \
            ARCH=arm64 \
            VERSION="$VERSION" \
            EXTRA_TAGS=gtk3

          chmod +x bin/uniTerm

          echo "===== Built binary ====="
          file bin/uniTerm

      - name: Verify ARM64 binary
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== Binary ====="
          file bin/uniTerm

          echo "===== ELF machine ====="
          readelf -h bin/uniTerm | grep 'Machine:' || true

          echo "===== Dynamic dependencies ====="
          ldd bin/uniTerm || true

          echo "===== WebKit / Soup / GTK references ====="
          readelf -d bin/uniTerm \
            | grep -Ei 'webkit|javascriptcore|soup|gtk' || true

          echo "===== GLIBC requirements ====="

          objdump -T bin/uniTerm 2>/dev/null \
            | grep -o 'GLIBC_[0-9.]*' \
            | sort -Vu \
            | tail -20 || true

          MAX_GLIBC="$(
            objdump -T bin/uniTerm 2>/dev/null \
              | grep -o 'GLIBC_[0-9.]*' \
              | sort -Vu \
              | tail -1
          )"

          echo "Maximum required GLIBC:"
          echo "$MAX_GLIBC"

          if echo "$MAX_GLIBC" | grep -Eq \
            'GLIBC_(2\.(3[2-9]|[4-9][0-9])|[3-9]\.)'; then

            echo "ERROR: binary requires glibc newer than 2.31"
            exit 1
          fi

      - name: Verify WebKitGTK 4.0 linkage
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== Required shared objects ====="
          readelf -d bin/uniTerm | grep NEEDED || true

          if readelf -d bin/uniTerm | grep -q 'webkit2gtk-4.1'; then
            echo "ERROR: binary still requires WebKitGTK 4.1"
            exit 1
          fi

          if readelf -d bin/uniTerm | grep -q 'libsoup-3.0'; then
            echo "ERROR: binary still requires libsoup 3"
            exit 1
          fi

          echo "OK: WebKitGTK 4.1 not required."
          echo "OK: libsoup 3 not required."

          echo "===== ldd WebKit result ====="
          ldd bin/uniTerm | grep -Ei 'webkit|soup|gtk' || true

      - name: Create tar.gz package
        shell: bash
        run: |
          set -euxo pipefail

          VERSION="${{ inputs.version }}"

          rm -rf dist/uniterm
          mkdir -p dist/uniterm

          install -m 755 \
            bin/uniTerm \
            dist/uniterm/uniterm

          cat > dist/uniterm/README-KYLIN.txt <<'EOF'
          uniTerm ARM64 - Kylin V10 / Ubuntu 20.04 compatible build

          Architecture:
            ARM64 / aarch64

          Build baseline:
            Ubuntu 20.04
            glibc 2.31

          GUI Runtime:
            GTK3
            WebKit2GTK 4.0
            libsoup 2.4

          Recommended runtime packages:

            sudo apt install \
              libgtk-3-0 \
              libwebkit2gtk-4.0-37 \
              libsoup2.4-1

          Test dependencies:

            ldd ./uniterm | grep "not found"

          Run:

            chmod +x uniterm
            ./uniterm

          Check architecture:

            uname -m

          Expected:

            aarch64
          EOF

          cd dist

          tar -czf \
            "../uniterm-linux-arm64-webkit40-${VERSION}.tar.gz" \
            uniterm

          cd ..

          echo "===== TAR package ====="
          ls -lh "uniterm-linux-arm64-webkit40-${VERSION}.tar.gz"

      - name: Create DEB package
        shell: bash
        run: |
          set -euxo pipefail

          VERSION="${{ inputs.version }}"

          DEB_VERSION="$(
            echo "$VERSION" \
              | sed 's/^v//' \
              | sed 's/[^0-9A-Za-z.+:~\-]/-/g'
          )"

          PKGROOT="dist/deb"

          rm -rf "$PKGROOT"

          mkdir -p \
            "$PKGROOT/DEBIAN" \
            "$PKGROOT/usr/bin" \
            "$PKGROOT/usr/share/applications" \
            "$PKGROOT/usr/share/icons/hicolor/256x256/apps"

          install -m 755 \
            bin/uniTerm \
            "$PKGROOT/usr/bin/uniterm"

          if [ -f build/linux/uniTerm.desktop ]; then
            cp \
              build/linux/uniTerm.desktop \
              "$PKGROOT/usr/share/applications/uniterm.desktop"

          elif [ -f build/linux/uniterm.desktop ]; then
            cp \
              build/linux/uniterm.desktop \
              "$PKGROOT/usr/share/applications/uniterm.desktop"

          else
            cat > "$PKGROOT/usr/share/applications/uniterm.desktop" <<'EOF'
          [Desktop Entry]
          Name=uniTerm
          Comment=All-in-one terminal
          Exec=/usr/bin/uniterm
          Icon=uniterm
          Terminal=false
          Type=Application
          Categories=Development;System;TerminalEmulator;
          EOF
          fi

          if [ -f build/appicon.png ]; then
            cp \
              build/appicon.png \
              "$PKGROOT/usr/share/icons/hicolor/256x256/apps/uniterm.png"
          fi

          cat > "$PKGROOT/DEBIAN/control" <<EOF
          Package: uniterm
          Version: ${DEB_VERSION}
          Section: utils
          Priority: optional
          Architecture: arm64
          Maintainer: uniTerm ARM64 Kylin Build
          Depends: libgtk-3-0, libwebkit2gtk-4.0-37, libsoup2.4-1
          Homepage: https://github.com/ys-ll/uniterm
          Description: uniTerm ARM64 build for Kylin V10
           GTK3 + WebKit2GTK 4.0 compatible build for
           Kylin V10 and Ubuntu 20.04 based ARM64 systems.
          EOF

          echo "===== Debian control ====="
          cat "$PKGROOT/DEBIAN/control"

          dpkg-deb \
            --build \
            --root-owner-group \
            "$PKGROOT" \
            "uniterm-linux-arm64-webkit40-${VERSION}.deb"

          echo "===== DEB package ====="
          ls -lh \
            "uniterm-linux-arm64-webkit40-${VERSION}.deb"

          echo "===== DEB metadata ====="
          dpkg-deb -I \
            "uniterm-linux-arm64-webkit40-${VERSION}.deb"

      - name: Final artifact information
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo " Build completed"
          echo "=========================================="

          ls -lh uniterm-linux-arm64-webkit40-*

          echo "===== Binary ====="
          file bin/uniTerm

          echo "===== Dynamic dependencies ====="
          ldd bin/uniTerm || true

          echo "===== SHA256 ====="
          sha256sum uniterm-linux-arm64-webkit40-*

      - name: Upload ARM64 Kylin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uniterm-linux-arm64-webkit40
          if-no-files-found: error
          retention-days: 30
          path: |
            uniterm-linux-arm64-webkit40-*.tar.gz
            uniterm-linux-arm64-webkit40-*.deb
