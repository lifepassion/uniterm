name: Build Linux ARM64 Kylin AppImage and DEB

on:
  push:
    branches: [main, fix/kylin-appimage]
    paths:
      - '.github/workflows/build-linux-arm64-kylin.yml'
      - 'build/kylin/**'
      - 'backend/credentials/**'
  workflow_dispatch:
    inputs:
      version:
        description: "Version name"
        required: false
        default: "v1.9.2-kylin-arm64.2"
        type: string

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    container:
      image: ubuntu:20.04

    env:
      DEBIAN_FRONTEND: noninteractive
      CGO_ENABLED: "1"
      GOOS: linux
      GOARCH: arm64
      VERSION: ${{ inputs.version || 'v1.9.2-kylin-arm64.2' }}
      VITE_VERSION: ${{ inputs.version || 'v1.9.2-kylin-arm64.2' }}

    steps:

      - name: Install base packages
        shell: bash
        run: |
          set -euxo pipefail

          apt-get update

          apt-get install -y \
            ca-certificates \
            curl \
            wget \
            git \
            xz-utils \
            tar \
            gzip \
            unzip \
            file \
            build-essential \
            gcc \
            g++ \
            make \
            pkg-config \
            binutils \
            patchelf \
            desktop-file-utils \
            python3 \
            python3-gi \
            xvfb \
            xauth

          echo "===== Architecture ====="
          uname -a
          dpkg --print-architecture

          echo "===== GLIBC ====="
          ldd --version | sed -n '1p'

      - name: Install GTK3 WebKitGTK 4.0
        shell: bash
        run: |
          set -euxo pipefail

          apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libsoup2.4-dev \
            libglib2.0-dev

          echo "===== GTK ====="
          pkg-config --modversion gtk+-3.0

          echo "===== WebKitGTK ====="
          pkg-config --modversion webkit2gtk-4.0

          echo "===== libsoup ====="
          pkg-config --modversion libsoup-2.4

          pkg-config --exists gtk+-3.0
          pkg-config --exists webkit2gtk-4.0
          pkg-config --exists libsoup-2.4

      - name: Checkout uniTerm
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"
          cache: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Show environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== Go ====="
          go version

          echo "===== Node ====="
          node --version

          echo "===== npm ====="
          npm --version

          echo "===== GCC ====="
          gcc --version | sed -n '1p'

          echo "===== GLIBC ====="
          ldd --version | sed -n '1p'

          echo "===== ARCH ====="
          uname -m

          echo "===== GTK ====="
          pkg-config --modversion gtk+-3.0

          echo "===== WebKitGTK ====="
          pkg-config --modversion webkit2gtk-4.0

          echo "===== libsoup ====="
          pkg-config --modversion libsoup-2.4

      - name: Download Go modules
        shell: bash
        run: |
          set -euxo pipefail
          go mod download

      - name: Patch a private Wails copy for WebKit 2.38
        shell: bash
        run: |
          set -euxo pipefail
          test "$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)" = v3.0.0-beta.16
          WAILS_DIR="$(go list -m -f '{{.Dir}}' github.com/wailsapp/wails/v3)"
          cp -a "$WAILS_DIR" /tmp/uniterm-kylin-wails
          chmod -R u+w /tmp/uniterm-kylin-wails
          python3 build/kylin/patch-wails.py /tmp/uniterm-kylin-wails
          go mod edit -replace github.com/wailsapp/wails/v3=/tmp/uniterm-kylin-wails
          (cd /tmp/uniterm-kylin-wails/cmd/wails3 && CGO_ENABLED=0 go install .)
          node build/kylin/test-fetch.cjs

      - name: Test request bodies in real WebKit 2.38
        shell: bash
        run: |
          set -euxo pipefail
          # The disposable CI container runs as root; Kylin users do not need this.
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 LIBGL_ALWAYS_SOFTWARE=1 \
            xvfb-run -a python3 build/kylin/test-webkit.py

      - name: Test credentials without a desktop keychain
        shell: bash
        run: go test ./backend/credentials

      - name: Install frontend dependencies
        shell: bash
        run: |
          set -euxo pipefail

          cd frontend

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Generate build assets
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$(go env GOPATH)/bin:$PATH"

          wails3 task common:update:build-assets

      - name: Build uniTerm ARM64
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$(go env GOPATH)/bin:$PATH"

          [[ "$VERSION" =~ ^v?[0-9][0-9A-Za-z.+~-]*$ ]]

          echo "=========================================="
          echo " Building uniTerm ARM64 Kylin"
          echo "=========================================="
          echo "ARCH      : arm64"
          echo "GLIBC     : 2.31 baseline"
          echo "GTK       : 3"
          echo "WebKit ABI: 4.0"
          echo "libsoup   : 2.4"
          echo "VERSION   : $VERSION"
          echo "=========================================="

          pkg-config --modversion gtk+-3.0
          pkg-config --modversion webkit2gtk-4.0
          pkg-config --modversion libsoup-2.4

          wails3 build \
            GOOS=linux \
            ARCH=arm64 \
            VERSION="$VERSION" \
            EXTRA_TAGS=gtk3

          chmod +x bin/uniTerm

          echo "===== Built binary ====="
          file bin/uniTerm

      - name: Verify ARM64 binary
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== Binary ====="
          file bin/uniTerm

          echo "===== ELF Machine ====="
          readelf -h bin/uniTerm \
            | grep 'Machine:' || true

          echo "===== Dynamic dependencies ====="
          ldd bin/uniTerm | tee /tmp/uniterm-ldd.txt
          if grep -q 'not found' /tmp/uniterm-ldd.txt; then exit 1; fi
          readelf -h bin/uniTerm | grep -q 'AArch64'

          echo "===== GTK/WebKit/Soup dependencies ====="
          ldd bin/uniTerm \
            | grep -Ei 'webkit|javascriptcore|soup|gtk' || true

          echo "===== GLIBC requirements ====="

          objdump -T bin/uniTerm 2>/dev/null \
            | grep -o 'GLIBC_[0-9.]*' \
            | sort -Vu \
            | tail -20 || true

          MAX_GLIBC="$(
            objdump -T bin/uniTerm 2>/dev/null \
              | grep -o 'GLIBC_[0-9.]*' \
              | sort -Vu \
              | tail -1
          )"

          echo "Maximum required GLIBC:"
          echo "$MAX_GLIBC"

          if echo "$MAX_GLIBC" | grep -Eq \
            'GLIBC_(2\.(3[2-9]|[4-9][0-9])|[3-9]\.)'; then

            echo "ERROR: Binary requires GLIBC newer than 2.31"
            exit 1
          fi

      - name: Verify WebKitGTK 4.0 linkage
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== NEEDED ====="
          readelf -d bin/uniTerm | grep NEEDED || true

          if readelf -d bin/uniTerm | grep -q 'webkit2gtk-4.1'; then
            echo "ERROR: binary requires WebKitGTK 4.1"
            exit 1
          fi

          if readelf -d bin/uniTerm | grep -q 'libsoup-3.0'; then
            echo "ERROR: binary requires libsoup 3"
            exit 1
          fi

          echo "===== Expected legacy dependencies ====="

          ldd bin/uniTerm \
            | grep -Ei \
              'webkit2gtk-4\.0|libsoup-2\.4|libgtk-3' || true

          readelf -d bin/uniTerm > /tmp/uniterm-needed.txt
          grep -q 'libwebkit2gtk-4.0.so' /tmp/uniterm-needed.txt
          grep -q 'libgtk-3.so' /tmp/uniterm-needed.txt
          if objdump -T bin/uniTerm | grep -E 'webkit_uri_scheme_request_get_http_body|webkit_web_view_evaluate_javascript'; then
            echo 'ERROR: binary still uses newer WebKit APIs'
            exit 1
          fi
          echo "OK: no WebKitGTK 4.1 dependency"
          echo "OK: no libsoup 3 dependency"

      - name: Test Wails RPC in a real desktop window
        shell: bash
        run: |
          set -euxo pipefail
          cp build/kylin/smoke.go.txt /tmp/kylin-smoke.go
          go build -tags production,gtk3 -o /tmp/kylin-smoke /tmp/kylin-smoke.go
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 LIBGL_ALWAYS_SOFTWARE=1 \
            xvfb-run -a /tmp/kylin-smoke

      - name: Create tar.gz package
        shell: bash
        run: |
          set -euxo pipefail

          [[ "$VERSION" =~ ^v?[0-9][0-9A-Za-z.+~-]*$ ]]

          rm -rf dist/uniterm
          mkdir -p dist/uniterm

          install -m 755 \
            bin/uniTerm \
            dist/uniterm/uniterm
          cp LICENSE dist/uniterm/LICENSE

          cat > dist/uniterm/README-KYLIN.txt <<'EOF'
          uniTerm ARM64
          Kylin V10 / Ubuntu 20.04 compatible build

          Architecture:
            ARM64 / aarch64

          Build baseline:
            Ubuntu 20.04
            GLIBC 2.31

          Runtime:
            GTK3
            WebKit2GTK 4.0
            libsoup 2.4

          Recommended runtime packages:

            sudo apt install \
              libgtk-3-0 \
              libwebkit2gtk-4.0-37 \
              libsoup2.4-1

          Check dependencies:

            ldd ./uniterm | grep "not found"

          Check GUI dependencies:

            ldd ./uniterm | grep -E "webkit|soup|gtk"

          Run:

            chmod +x uniterm
            ./uniterm
          EOF

          cd dist

          tar -czf \
            "../uniterm-linux-arm64-webkit40-${VERSION}.tar.gz" \
            uniterm

          cd ..

          echo "===== TAR package ====="
          ls -lh \
            "uniterm-linux-arm64-webkit40-${VERSION}.tar.gz"

      - name: Create DEB package
        shell: bash
        run: |
          set -euxo pipefail

          [[ "$VERSION" =~ ^v?[0-9][0-9A-Za-z.+~-]*$ ]]

          DEB_VERSION="$(
            echo "$VERSION" \
              | sed 's/^v//' \
              | sed 's/[^0-9A-Za-z.+:~\-]/-/g'
          )"

          PKGROOT="dist/deb"

          rm -rf "$PKGROOT"

          mkdir -p \
            "$PKGROOT/DEBIAN" \
            "$PKGROOT/usr/bin" \
            "$PKGROOT/usr/share/applications" \
            "$PKGROOT/usr/share/icons/hicolor/256x256/apps"

          install -m 755 \
            bin/uniTerm \
            "$PKGROOT/usr/bin/uniterm"

          if [ -f build/linux/uniTerm.desktop ]; then
            cp \
              build/linux/uniTerm.desktop \
              "$PKGROOT/usr/share/applications/uniterm.desktop"

          elif [ -f build/linux/uniterm.desktop ]; then
            cp \
              build/linux/uniterm.desktop \
              "$PKGROOT/usr/share/applications/uniterm.desktop"

          else
            cat > \
              "$PKGROOT/usr/share/applications/uniterm.desktop" <<'EOF'
          [Desktop Entry]
          Name=uniTerm
          Comment=All-in-one terminal
          Exec=/usr/bin/uniterm
          Icon=uniterm
          Terminal=false
          Type=Application
          Categories=Development;System;TerminalEmulator;
          EOF
          fi

          sed -i 's|^Exec=.*|Exec=/usr/bin/uniterm|; s|^Icon=.*|Icon=uniterm|' \
            "$PKGROOT/usr/share/applications/uniterm.desktop"
          desktop-file-validate "$PKGROOT/usr/share/applications/uniterm.desktop"

          if [ -f build/appicon.png ]; then
            cp \
              build/appicon.png \
              "$PKGROOT/usr/share/icons/hicolor/256x256/apps/uniterm.png"
          fi

          cat > "$PKGROOT/DEBIAN/control" <<EOF
          Package: uniterm
          Version: ${DEB_VERSION}
          Section: utils
          Priority: optional
          Architecture: arm64
          Maintainer: uniTerm ARM64 Kylin Build
          Depends: libc6 (>= 2.31), libgtk-3-0, libwebkit2gtk-4.0-37 (>= 2.38), libsoup2.4-1
          Homepage: https://github.com/ys-ll/uniterm
          Description: uniTerm ARM64 for Kylin V10
           GTK3 and WebKit2GTK 4.0 compatible build.
           Built against Ubuntu 20.04 / GLIBC 2.31.
          EOF

          echo "===== Debian control ====="
          cat "$PKGROOT/DEBIAN/control"

          dpkg-deb \
            --build \
            --root-owner-group \
            "$PKGROOT" \
            "uniterm-linux-arm64-webkit40-${VERSION}.deb"

          echo "===== DEB package ====="
          ls -lh \
            "uniterm-linux-arm64-webkit40-${VERSION}.deb"

          echo "===== DEB metadata ====="
          dpkg-deb -I \
            "uniterm-linux-arm64-webkit40-${VERSION}.deb"

      - name: Bundle GTK and WebKit runtime into AppImage
        shell: bash
        run: |
          set -euxo pipefail
          apt-get install -y --no-install-recommends \
            libgl1-mesa-dri libegl1-mesa libglx-mesa0 libgles2 \
            glib-networking gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            fonts-dejavu-core fonts-noto-cjk adwaita-icon-theme \
            bubblewrap xdg-dbus-proxy fontconfig
          python3 build/kylin/appimage-bundle.py
          curl -fL --retry 3 -o /tmp/appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-aarch64.AppImage
          echo 'f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158  /tmp/appimagetool.AppImage' | sha256sum -c -
          curl -fL --retry 3 -o /tmp/appimage-runtime \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-aarch64
          echo '00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444  /tmp/appimage-runtime' | sha256sum -c -
          chmod +x /tmp/appimagetool.AppImage
          ARCH=aarch64 /tmp/appimagetool.AppImage --appimage-extract-and-run \
            --runtime-file /tmp/appimage-runtime dist/UniTerm.AppDir \
            "uniterm-linux-arm64-webkit40-${VERSION}.AppImage"
          sha256sum "uniterm-linux-arm64-webkit40-${VERSION}.AppImage" > AppImage-SHA256SUMS

      - name: Upload AppImage for isolated validation
        uses: actions/upload-artifact@v4
        with:
          name: uniterm-appimage-arm64
          if-no-files-found: error
          compression-level: 0
          path: |
            uniterm-linux-arm64-webkit40-*.AppImage
            AppImage-SHA256SUMS
            dist/UniTerm.AppDir/runtime-manifest.json

      - name: Final artifact information
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo " BUILD COMPLETED"
          echo "=========================================="

          ls -lh uniterm-linux-arm64-webkit40-*

          echo "===== Binary ====="
          file bin/uniTerm

          echo "===== Runtime deps ====="
          ldd bin/uniTerm \
            | grep -Ei \
              'webkit|soup|gtk|not found' || true

          echo "===== SHA256 ====="
          sha256sum uniterm-linux-arm64-webkit40-*

      - name: Upload ARM64 Kylin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uniterm-linux-arm64-webkit40
          if-no-files-found: error
          retention-days: 30
          path: |
            uniterm-linux-arm64-webkit40-*.tar.gz
            uniterm-linux-arm64-webkit40-*.deb

  test-appimage-clean:
    needs: build-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    container:
      image: ubuntu:20.04
    steps:
      - name: Install only a virtual display server
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends xvfb xauth ca-certificates strace
          if dpkg-query -W -f='${Status}' libwebkit2gtk-4.0-37 2>/dev/null | grep -q 'install ok installed'; then exit 1; fi
          if dpkg-query -W -f='${Status}' libgtk-3-0 2>/dev/null | grep -q 'install ok installed'; then exit 1; fi
          ldd --version | head -1
      - uses: actions/download-artifact@v4
        with:
          name: uniterm-appimage-arm64
      - name: Verify archive and run without system WebKit or GTK
        shell: bash
        run: |
          set -euxo pipefail
          sha256sum -c AppImage-SHA256SUMS
          chmod +x ./*.AppImage
          # Exercise relocation, spaces, XML escaping and operation without FUSE.
          mkdir 'relocated & 中文目录'
          mv ./*.AppImage 'relocated & 中文目录/'
          cd 'relocated & 中文目录'
          ulimit -c 0
          set +e
          UNITERM_APPIMAGE_SMOKE_TEST=1 WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 \
            xvfb-run -a strace -f -e trace=file,process -s 256 -o ../appimage.trace \
              ./*.AppImage --appimage-extract-and-run
          result=$?
          set -e
          grep -E 'WebKit|injected|execve|ENOENT.*\.so' ../appimage.trace | tail -100 || true
          exit "$result"
      - name: Upload clean environment trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: appimage-clean-trace
          path: appimage.trace
